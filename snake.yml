name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manthan291999
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%232d3343,%230d1b2a,%23163b3f,%23198a72,%2310B981
            dist/snake-light.svg?palette=github-light&color_snake=%237C3AED&color_dots=%23e8e8e8,%23c6e6de,%2396d4be,%2350af8f,%23059669

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
